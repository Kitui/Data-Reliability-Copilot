name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push immutable image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Run migrations as Cloud Run Job
        run: |
          gcloud run jobs update "${SERVICE}-migrate" --image "$IMAGE" --region "$REGION" --command alembic --args upgrade,head --quiet || \
          gcloud run jobs create "${SERVICE}-migrate" --image "$IMAGE" --region "$REGION" --command alembic --args upgrade,head --quiet
          gcloud run jobs execute "${SERVICE}-migrate" --region "$REGION" --wait
      - name: Deploy without immediate traffic
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --no-traffic --tag candidate --quiet
      - name: Verify candidate
        run: curl --fail --retry 12 --retry-delay 5 "https://candidate---${SERVICE}-${{ vars.CLOUD_RUN_REGION_HASH }}.a.run.app/health/ready"
      - name: Promote candidate
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-tags candidate=100 --quiet
